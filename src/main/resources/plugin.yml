name: SHParkour
version: '${project.version}'
main: org.Cry_Legende.sHParkour.SHParkour
api-version: '1.20'
author: Cry_Legende
description: Un plugin de parkour avancé avec création de parcours, checkpoints, hologrammes et protections.
depend: [PlaceholderAPI, FancyHolograms, SHInventoryPages]
# SHNetwork est facultatif : sans lui, temps et récompenses restent dans playerdata.yml comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (temps en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  parkour:
    description: Commande principale du plugin SHParkour.
    aliases: [shpk]
    usage: "/<command> <create|delete|setup|reload|resettime|top|import>"

permissions:
  shparkour.admin.*:
    description: Donne un accès complet à toutes les commandes d'administration de SHParkour.
    default: op
    children:
      shparkour.admin.create: true
      shparkour.admin.delete: true
      shparkour.admin.setup: true
      shparkour.admin.reload: true
      shparkour.admin.bypass.commands: true
      shparkour.admin.resettime: true
      shparkour.admin.top: true
      shparkour.admin.import: true

  shparkour.admin.create:
    description: Permet de créer un nouveau parcours avec /parkour create.
    default: op

  shparkour.admin.delete:
    description: Permet de supprimer un parcours existant avec /parkour delete.
    default: op

  shparkour.admin.setup:
    description: Permet de configurer les points d'un parcours avec /parkour setup.
    default: op

  shparkour.admin.reload:
    description: Permet de recharger la configuration du plugin avec /parkour reload.
    default: op

  shparkour.admin.bypass.commands:
    description: Permet à un administrateur d'utiliser des commandes normalement bloquées pendant un parkour.
    default: op

  shparkour.admin.resettime:
    description: Permet de retirer le temps d'un joueur d'un parcours (classements compris).
    default: op

  shparkour.admin.top:
    description: Permet de consulter le classement complet d'un parcours avec /parkour top.
    default: op

  shparkour.admin.import:
    description: Permet de copier playerdata.yml dans la base du réseau avec /parkour import (mode réseau).
    default: op
