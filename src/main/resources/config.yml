# ======================================================================== #
#                      SHParkour - Configuration                           #
# ======================================================================== #
#
# Plugin : parcours de parkour avec plaques de pression (départ, checkpoints, arrivée), hologrammes
# FancyHolograms, classements, récompenses de première arrivée et protections pendant la course.
# Chaque parcours a son fichier dans parkours/ (modèle : parkour_template.yml).
#
# Commandes (alias /shpk) :
#   /parkour create <nom>                    Crée un parcours.                      shparkour.admin.create
#   /parkour delete <nom>                    Supprime un parcours.                  shparkour.admin.delete
#   /parkour setup <nom> <option>            Place départ, arrivée, checkpoints...  shparkour.admin.setup
#   /parkour reload                          Recharge ce fichier et les parcours.   shparkour.admin.reload
#   /parkour resettime <parcours> <joueur>   Retire le meilleur temps d'un joueur.  shparkour.admin.resettime
#   /parkour top <parcours> [page]           Classement complet.                    shparkour.admin.top
#   /parkour import                          Avec SHNetwork : copie playerdata.yml dans la base.  shparkour.admin.import
#
# Autre permission : shparkour.admin.bypass.commands (commandes autorisées pendant un parcours).
#
# Plusieurs serveurs de jeu : les parcours sont dans des mondes qui n'existent que sur un seul serveur (par exemple
# celui du spawn), c'est lui qui joue les parcours (et lui seul garde playerstates/, l'inventaire mis de côté pendant
# la course). Avec SHNetwork (voir la section 'reseau' en bas du
# fichier), les temps, les parcours terminés, les récompenses de checkpoint et les classements sont dans une base
# partagée : les placeholders %shparkour_...% et /parkour top montrent les mêmes données sur tous les serveurs.
# Sans SHNetwork, rien ne change : playerdata.yml reste sur ce serveur-là (et sur un autre serveur, les temps lus
# par les placeholders ne seraient que ceux d'une copie de playerdata.yml qui n'est pas mise à jour).
#
# ======================================================================== #

# Préfixe utilisé dans les messages du plugin
prefix: "" # Le préfixe global est géré par message individuel

# Messages configurables
messages:
  no-permission: "&7&l« &c&lSH &8&l» &7Vous n'avez pas la permission d'exécuter cette commande."
  player-only: "&7&l« &c&lSH &8&l» &7Cette commande ne peut être exécutée que par un joueur."
  parkour-not-found: "&7&l« &c&lSH &8&l» &7Le parcours '&c{parkour}&7' n'a pas été trouvé."
  parkour-already-exists: "&7&l« &c&lSH &8&l» &7Un parcours avec le nom '&c{parkour}&7' existe déjà."
  parkour-created: "&7&l« &a&lSH &8&l» &7Le parcours '&a{parkour}&7' a été créé ! Utilisez &b/parkour setup {parkour} &7pour le configurer."
  parkour-deleted: "&7&l« &a&lSH &8&l» &7Le parcours '&a{parkour}&7' a été supprimé."
  parkour-reloaded: "&7&l« &a&lSH &8&l» &7La configuration des parcours a été rechargée &aavec succès&7."
  reset-time-success: "&7&l« &a&lSH &8&l» &7Le temps du joueur &a{player} &7sur le parcours &b{parkour} &7a été réinitialisé &aavec succès&7."
  reset-time-no-time: "&7&l« &c&lSH &8&l» &7Le joueur &c{player} &7n'a pas de temps enregistré sur le parcours &b{parkour}&7."
  player-not-found-for-reset: "&7&l« &c&lSH &8&l» &7Le joueur &c{player} &7n'a pas été trouvé ou n'a jamais joué sur le serveur."

  # Messages de setup
  setup:
    set-start: "&7&l« &a&lSH &8&l» &7Le spawn du parcours '&a{parkour}&7' a été défini à votre position."
    set-end: "&7&l« &a&lSH &8&l» &7La fin du parcours '&a{parkour}&7' a été définie à votre position."
    add-checkpoint: "&7&l« &a&lSH &8&l» &7Checkpoint &a#{index} &7ajouté au parcours '&a{parkour}&7'."
    set-respawn: "&7&l« &a&lSH &8&l» &7Le point de respawn (en cas de chute) a été défini."
    set-endspawn: "&7&l« &a&lSH &8&l» &7Le point de téléportation de fin a été défini."
    set-displayname: "&7&l« &a&lSH &8&l» &7Le nom d'affichage du parcours a été changé pour '&a{name}&7'."

  # Messages en jeu (ces messages sont souvent affichés directement au joueur, sans le préfixe lourd)
  parkour-join: "&7&l« &e&lSH &8&l» &7Vous avez commencé le parcours &e{parkour}&7."
  parkour-leave: "&7&l« &e&lSH &8&l» &7Vous avez quitté le parcours &e{parkour}&7."
  parkour-finish: "&7&l« &a&lSH &8&l» &7Félicitations ! Vous avez terminé le parcours &b{parkour} &7en &a{time}&7."
  new-best-time: "&7&l« &a&lSH &8&l» &7Nouveau record personnel ! Votre nouveau meilleur temps est &a{time}&7."
  checkpoint-reached: "&7&l« &a&lSH &8&l» &7Checkpoint &a#{index} &7atteint !"
  checkpoints-missing: "&7&l« &c&lSH &8&l» &7Vous devez passer &ctous les checkpoints &7avant de finir !"
  time-expired: "&7&l« &c&lSH &8&l» &7Temps écoulé ! Vous avez été retiré du parcours &c{parkour}&7."
  parkour-not-configured: "&7&l« &c&lSH &8&l» &7Le parcours &c{parkour} &7n'est pas encore configuré (pas de départ)."

  # Messages de protection
  protection:
    fly-denied: "&7&l« &c&lSH &8&l» &7Le vol est désactivé pendant un parcours."
    teleport-denied: "&7&l« &c&lSH &8&l» &7La téléportation est désactivée pendant un parcours."
    effects-denied: "&7&l« &c&lSH &8&l» &7Les effets de potions sont désactivés pendant un parcours."
    item-use-denied: "&7&l« &c&lSH &8&l» &7Vous ne pouvez pas utiliser cet objet pendant un parcours."
    command-denied: "&7&l« &c&lSH &8&l» &7Vous ne pouvez pas utiliser cette commande pendant un parcours."
    # Joueur devenu passager (monture, véhicule, assis sur un autre joueur) : il sort du parcours.
    vehicle-denied: "&7&l« &c&lSH &8&l» &7Vous ne pouvez pas être &cporté &7pendant un parcours : vous l'avez quitté."

  # Mode réseau (SHNetwork)
  network:
    loading: "&7&l« &e&lSH &8&l» &7Vos données de parcours sont en cours de chargement, réessayez dans un instant."
    database-error: "&7&l« &c&lSH &8&l» &7La base du réseau ne répond pas."
    import-done: "&7&l« &a&lSH &8&l» &7Importation terminée : &a{players} &7joueur(s), &a{parkours} &7parcours et &a{checkpoints} &7récompense(s) de checkpoint ajoutés, &a{present} &7déjà présent(s) (&a{read} &7joueur(s) lus)."
    import-failed: "&7&l« &c&lSH &8&l» &7L'importation a échoué, &cvérifiez la console&7."
    import-no-network: "&7&l« &c&lSH &8&l» &7Cette commande demande le &cmode réseau &7(SHNetwork installé et base joignable)."

# Format de l'actionbar affichant le temps
actionbar-format: "&b&lPARKOUR {parkour_display_name} &r&8| &7Temps: &f{time}"

fall-protection:
  enabled: true
  # Le nombre de blocs que le joueur peut chuter en dessous de son dernier point de respawn
  # avant d'être téléporté. Mettre à 0 pour désactiver.
  max-fall-distance: 15.0

# Commandes bloquées pendant le parkour (en minuscules)
allowed-commands:
  - "m"
  - "mp"
  - "message"
  - "msg"
  - "r"
  - "reply"
  - "mess"

# Items donnés au joueur pendant le parkour
# Slots: 0-8 pour la barre d'inventaire
parkour-items:
  checkpoint:
    enabled: true
    slot: 3
    material: "LIGHT_WEIGHTED_PRESSURE_PLATE"
    name: "&aDernier Checkpoint"
    lore:
      - "&7Cliquez pour vous téléporter."
  restart:
    enabled: true
    slot: 4
    material: "OAK_DOOR"
    name: "&6Recommencer le parcours"
    lore:
      - "&7Cliquez pour retourner au début."
  leave:
    enabled: true
    slot: 5
    material: "RED_BED"
    name: "&cQuitter le parcours"
    lore:
      - "&7Cliquez pour abandonner."
  toggle-players:
    enabled: true
    slot: 8
    material: "LIME_DYE" # Sera GRAY_DYE quand les joueurs sont cachés
    name: "&aCacher les joueurs"
    lore:
      - "&7Cliquez pour changer la visibilité."

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : les temps, les parcours terminés
# (récompense de première arrivée) et les récompenses de checkpoint de chaque joueur sont alors dans la base partagée
# (tables shparkour_players, shparkour_times et shparkour_checkpoints) au lieu de playerdata.yml. Ils sont lus à la
# connexion du joueur, une fois que l'autre serveur a fini de le sauvegarder, puis chaque arrivée est écrite aussitôt
# (le meilleur temps ne s'écrit que s'il est plus petit). Les classements viennent de la base, gardés en mémoire pour
# les placeholders. playerdata.yml n'est plus lu ni écrit : /parkour import le copie une fois dans la base, sans rien
# écraser. Sans SHNetwork, rien de ceci n'est utilisé. Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de lire ses données
  attente-max-secondes: 10
  # Canal du bus SHNetwork : chaque serveur y prévient les autres qu'un classement a changé ou qu'un temps a été retiré
  canal: shparkour
  # Intervalle, en secondes, entre deux relectures des classements en base (en plus de celle qui suit chaque changement)
  cache-classements-secondes: 15
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: shparkour
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000
